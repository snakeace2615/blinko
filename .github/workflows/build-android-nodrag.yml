name: Build Android APK (No Drag)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/src/pages/index.tsx'
      - '.github/workflows/build-android-nodrag.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NDK_VERSION: 27.0.11902837
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 34 and NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.11902837"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.8

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install project dependencies
        run: |
          bun install --frozen-lockfile
          bun run prisma:generate

      - name: Prepare separate Android app and temporary Gradle signing configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src-tauri/gen/android/app/build.gradle.kts")
          content = path.read_text()
          marker = '        getByName("debug") {'
          if marker not in content:
              raise SystemExit("Could not locate Android debug build configuration")
          content = content.replace(marker, marker + '\n            applicationIdSuffix = ".nodrag"', 1)
          path.write_text(content)
          PY

          # Gradle evaluates its release signing block even in debug builds.
          # Create a temporary, throwaway signing config so it can be parsed.
          KEY_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/blinko-ci.jks" \
            -storepass "$KEY_PASS" -keypass "$KEY_PASS" -alias ci \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Blinko CI"
          printf 'password=%s\nkeyAlias=ci\nstoreFile=%s\n' \
            "$KEY_PASS" "$RUNNER_TEMP/blinko-ci.jks" \
            > app/src-tauri/gen/android/keystore.properties

      - name: Build Android debug APK (ARM64)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cd app
          bun run tauri:android:build --debug --apk --target aarch64 --ci

      - name: Verify generated APK
        run: |
          APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "Built APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "^package:"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Blinko-1.8.9-NoDrag-Android-ARM64-debug
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
